<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../pages/Admin_course_page.html">
</head>
<body>

<!-- HEADER -->
<header class="header">
  <h1>FSSA</h1>
</header>

<!-- SIDEBAR -->
<aside class="sidebar">
  <ul>
    <li><a href="#"><i class="fa-solid fa-chart-line"></i>Dashboard</a></li>
    <li><a href="Admin_course_page.html"><i class="fa-solid fa-book"></i> Courses</a></li>
    <li><a href="#"><i class="fa-solid fa-calendar-check"></i> Attendance</a></li>
    <li class="#"><a href="#"><i class="fa-solid fa-user-graduate"></i> Students</a></li>
    <li><a href="#"><i class="fa-solid fa-chart-line"></i> Reports</a></li>
    <li><a href="#"><i class="fa-solid fa-gear"></i> Settings</a></li>
  </ul>
</aside>

<!-- MAIN CONTENT -->
<main class="main">

  <!-- SEARCH + ADD -->
  <section class="card row-between">
    <input type="text" placeholder="Search student..." class="input" >
    <button class="btn-primary">+ Add Student</button>
  </section>

  <!-- FILTERS -->
  <section class="card filters">
    <div>
      <label>Section</label>
      <select>
        <option>Select</option>
        <option>A</option>
        <option>B</option>
      </select>
    </div>

    <div>
      <label>Batch</label>
      <select>
        <option>Select</option>
        <option>1</option>
        <option>2</option>
      </select>
    </div>
  </section>

  <!-- TABLE -->
  <section class="card">
    <table>
      <thead>
        <tr>
          <th>Student Name</th>
          <th>Section</th>
          <th>Batch</th>
          <th>Last Update</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>Vivekanandhan P</td>
          <td>C</td>
          <td>5</td>
          <td>No update</td>
          <td class="actions">
            <button class="edit">Edit</button>
            <button class="delete">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </section>

</main>

</body>
</html>
