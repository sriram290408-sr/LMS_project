<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSSA - Student Attendance</title>
    <link rel="stylesheet" href="./attendance.css">
</head>
<body>

    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">FSSA</div>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-item">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm10 0h8v8h-8z"/></svg>
                    Dashboard
                </a></li>
                <li><a href="#" class="nav-item">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M4 6h16v12H4zm2 2v8h12V8zm-2-4h16v2H4z"/></svg>
                    Courses
                </a></li>
                <li><a href="#" class="nav-item active">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
                    Attendance
                </a></li>
                <li><a href="#" class="nav-item">
                    <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
                    Students
                </a></li>
                <li><a href="#" class="nav-item">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6z"/></svg>
                    Reports
                </a></li>
                <li><a href="#" class="nav-item">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                    Settings
                </a></li>
            </ul>
        </aside>

        <main class="main-content">
            
            <header class="top-header">
                <div class="search-bar">
                    <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    <input type="text" placeholder="Search" class="search-input">
                </div>
            </header>

            <section class="controls-row">
                <div class="filters">
                    <div class="filter-group">
                        <label>Section</label>
                        <div class="custom-select">
                            <select>
                                <option>Section B</option>
                                <option>Section A</option>
                                <option>Section C</option>
                            </select>
                            <svg class="chevron" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
                        </div>
                    </div>
                    <div class="filter-group">
                        <label>Date</label>
                        <input type="date" value="2025-10-14" class="date-input">
                    </div>
                </div>

                <div class="global-actions">
                    <button class="btn btn-green-outline" onclick="markAll('Present')">Mark all Present</button>
                    <button class="btn btn-red-outline" onclick="markAll('Absent')">Mark all Absent</button>
                </div>
            </section>

            <div class="attendance-card">
                <div class="card-header">
                    <h3>Student Attendance</h3>
                    <p>Mark status for each student in the selected course and date.</p>
                </div>

                <div class="table-scroll-container">
                    <table class="student-table">
                        <thead>
                            <tr>
                                <th style="width: 80px;">Photo</th>
                                <th style="text-align: left;">Student Name</th>
                                <th>Roll No</th>
                                <th style="width: 160px;">Status</th>
                            </tr>
                        </thead>
                        <tbody id="studentList">
                            </tbody>
                    </table>
                </div>
            </div>

            <div class="footer-actions">
                <button class="btn btn-blue-solid" onclick="saveAttendance()">Save Attendance</button>
            </div>

        </main>
    </div>

    <script src="./attendance.js"></script>
</body>
</html>
